<style>
    /* Blank Annexure separator/title page, printed right before "Annexure-3"'s
       first plant page — same shape/positioning as ready_reckoner_separator.html
       (see that template's own comment for why 105mm padding-top, not
       vh/flex centering). */
    .mur-separator-wrap {
        text-align: center;
        padding-top: 105mm;
    }
    .mur-separator-annexure {
        font-weight: 700;
        font-size: 26pt;
        color: {{ colors.text_black|default('#000000') }};
    }
    .mur-separator-group {
        font-weight: 700;
        font-size: 18pt;
        color: {{ colors.text_rust_brown|default('#B7410E') }};
        margin-top: 10px;
    }
</style>

<div class="mur-separator-wrap">
    <div class="mur-separator-annexure">{{ page.annexure_label }}</div>
    <div class="mur-separator-group">{{ page.group_label }}</div>
</div>
